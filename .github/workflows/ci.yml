name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Sandbox contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Run complete sandbox suite
        run: bash tests/run-all.sh


  exact-build:
    name: Exact pinned build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out Control Suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned ASF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JustArchiNET/ArchiSteamFarm
          ref: 27bd1d5dbdc8c4897eaaed0e3246d10ffe18b0ad
          path: deps/asf
          submodules: recursive
          persist-credentials: false

      - name: Check out pinned PlaytimeGoals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: M0npet/PlaytimeGoals
          ref: aa8b808c9d68c6629ce4871ba337159f38898a1b
          path: deps/ptg
          persist-credentials: false

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.400"

      - name: Prepare exact source worktree
        run: |
          bash scripts/build/prepare-release-worktree.sh             "$GITHUB_WORKSPACE/deps/asf"             "$GITHUB_WORKSPACE/deps/ptg"             "$RUNNER_TEMP/asf-control-suite-build"

      - name: Compile exact pinned release graph
        run: bash scripts/build/build-release.sh "$RUNNER_TEMP/asf-control-suite-build"
