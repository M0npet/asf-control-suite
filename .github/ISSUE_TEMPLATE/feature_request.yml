name: Feature request
description: Suggest an improvement
title: "[Feature] "

body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - AccountManager
        - ControlCenter
        - ControlWeb
        - PlaytimeGoals integration
        - Packaging / release
        - Phone deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
